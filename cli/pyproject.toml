[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "twdll"
version = "0.1.0"
description = "Cross-platform reverse-engineering CLI for Warscape Total War"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0.0",
    "pyghidra>=2.0.0",
    "rich>=14.0.0",
    "typer>=0.15.0",
    "vdf>=3.4",
]

[project.scripts]
twdll = "twdll.cli:main"

[dependency-groups]
dev = [
    "basedpyright>=1.27.0",
    "import-linter>=2.1",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/twdll"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "PTH",
    "PT",
    "RUF",
    "C4",
    "C90",
    "PIE",
    "RET",
    "TID",
    "PLR0912",
    "PLR0913",
    "PLR0915",
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-branches = 8
max-args = 5
max-statements = 30

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"twdll.domain.WorkspacePaths".msg = "Pass WorkspaceContext (ctx.paths) instead of importing WorkspacePaths outside domain.py."
"twdll.domain.load_config".msg = "Use WorkspaceContext.from_root(root) instead of calling load_config directly."

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
extraPaths = ["src"]
venvPath = "../.twdll/uv"
venv = "venv"
reportMissingTypeStubs = false
reportUnusedCallResult = false
reportAny = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]

[tool.importlinter]
root_package = "twdll"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Strict one-way domain layers"
type = "layers"
layers = [
    "twdll.cli",
    "twdll.mcp",
    "twdll.init | twdll.analyze",
    "twdll._ghidra | twdll.database",
    "twdll.domain",
]

[[tool.importlinter.contracts]]
name = "Only database module may import sqlite3"
type = "forbidden"
source_modules = [
    "twdll.cli",
    "twdll.mcp",
    "twdll.init",
    "twdll.analyze",
    "twdll._ghidra",
    "twdll.domain",
]
forbidden_modules = [
    "sqlite3",
]

[[tool.importlinter.contracts]]
name = "Only _ghidra module may import pyghidra or jpype"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "twdll.cli",
    "twdll.mcp",
    "twdll.init",
    "twdll.analyze",
    "twdll.database",
    "twdll.domain",
]
forbidden_modules = [
    "pyghidra",
    "jpype",
]

[[tool.importlinter.contracts]]
name = "Only cli module may import typer or rich"
type = "forbidden"
source_modules = [
    "twdll.mcp",
    "twdll.init",
    "twdll.analyze",
    "twdll._ghidra",
    "twdll.database",
    "twdll.domain",
]
forbidden_modules = [
    "rich",
    "typer",
]

[[tool.importlinter.contracts]]
name = "Only mcp module may import mcp"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "twdll.cli",
    "twdll.init",
    "twdll.analyze",
    "twdll._ghidra",
    "twdll.database",
    "twdll.domain",
]
forbidden_modules = [
    "mcp",
]
